[project]
name = "crypto-mas"
version = "0.1.0"
description = "Risk-first, explainable, backtestable, portfolio-aware crypto trading engine."
readme = "README.md"
authors = [
    { name = "Tuncay Çelikkanat", email = "celikkanattuncay@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "apscheduler>=3.11.3",
    "fastapi>=0.136.1",
    "numba>=0.61.2",
    "numpy>=2.2.6",
    "orjson>=3.11.8",
    "pandas>=2.3.3",
    "pandas-ta>=0.4.71b0",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.49",
    "tenacity>=9.1.4",
    "uvicorn>=0.46.0",
    "uvloop>=0.22.1",
    "websockets>=13.0.0",
]

[project.scripts]
crypto-mas = "crypto_mas:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
