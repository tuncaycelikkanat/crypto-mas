services:
  - type: web
    name: crypto-mas-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: TRADING_MODE
        value: PAPER
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: API_SECURITY_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ENABLED
        value: "false"
